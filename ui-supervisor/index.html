<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GAGA GPS — Supervisor</title>

    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #0d1117;
        color: #ffffff;
        font-family: "Arial", sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Header ── */
      #header {
        height: 55px;
        background: #161b22;
        border-bottom: 2px solid #00ff88;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        flex-shrink: 0;
      }

      #header h1 {
        font-size: 18px;
        color: #00ff88;
        font-weight: bold;
      }

      #header-right {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      #connection-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff4444;
      }

      #connection-dot.connected {
        background: #00ff88;
      }

      /* ── Layout principal ── */
      #main {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* ── Panel izquierdo ── */
      #left-panel {
        width: 320px;
        background: #161b22;
        border-right: 1px solid #30363d;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex-shrink: 0;
      }

      /* ── Dashboard de métricas ── */
      #dashboard {
        padding: 16px;
        border-bottom: 1px solid #30363d;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .metric-card {
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 12px;
        text-align: center;
      }

      .metric-label {
        font-size: 10px;
        color: #8b949e;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .metric-value {
        font-size: 24px;
        font-weight: bold;
        color: #00ff88;
      }

      .metric-value.alert {
        color: #ff4444;
      }
      .metric-value.warning {
        color: #ffaa00;
      }

      /* ── Botón parada preventiva ── */
      #stop-section {
        padding: 16px;
        border-bottom: 1px solid #30363d;
      }

      #btn-stop {
        width: 100%;
        padding: 14px;
        background: #ff2222;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        letter-spacing: 0.5px;
      }

      #btn-stop:hover {
        background: #cc0000;
      }

      #btn-resume {
        width: 100%;
        padding: 14px;
        background: #00aa44;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 8px;
        display: none;
      }

      #btn-resume:hover {
        background: #008833;
      }
      #btn-resume.visible {
        display: block;
      }

      #stop-status {
        margin-top: 8px;
        font-size: 12px;
        color: #8b949e;
        text-align: center;
      }

      #stop-status.active {
        color: #ff4444;
        font-weight: bold;
      }

      /* ── Lista de vehículos ── */
      #vehicle-list-header {
        padding: 12px 16px;
        font-size: 12px;
        color: #8b949e;
        text-transform: uppercase;
        border-bottom: 1px solid #30363d;
      }

      #vehicle-list {
        flex: 1;
        overflow-y: auto;
      }

      .vehicle-item {
        padding: 12px 16px;
        border-bottom: 1px solid #21262d;
        cursor: pointer;
        transition: background 0.2s;
      }

      .vehicle-item:hover {
        background: #21262d;
      }

      .vehicle-item.alert-active {
        border-left: 3px solid #ff4444;
        background: #1a0d0d;
      }

      .vehicle-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
      }

      .vehicle-name {
        font-size: 14px;
        font-weight: bold;
      }

      .vehicle-type {
        font-weight: normal;
        color: #8b949e;
      }

      .vehicle-status {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        background: #238636;
        color: white;
      }

      .vehicle-status.offline {
        background: #6e7681;
      }

      .vehicle-status.alert {
        background: #da3633;
      }

      .vehicle-info {
        font-size: 12px;
        color: #8b949e;
      }

      /* ── Panel de alertas ── */
      #alerts-section {
        padding: 12px 16px;
        border-bottom: 1px solid #30363d;
        max-height: 200px;
        overflow-y: auto;
      }

      #alerts-header {
        font-size: 12px;
        color: #8b949e;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .alert-item {
        padding: 8px;
        border-radius: 6px;
        margin-bottom: 6px;
        font-size: 12px;
        border-left: 3px solid;
      }

      .alert-item.danger {
        background: #1a0d0d;
        border-color: #ff4444;
        color: #ff8888;
      }

      .alert-item.warning {
        background: #1a1400;
        border-color: #ffaa00;
        color: #ffcc44;
      }

      .alert-item.info {
        background: #0d1a1a;
        border-color: #00ff88;
        color: #88ffcc;
      }

      .alert-time {
        font-size: 10px;
        color: #6e7681;
        margin-top: 2px;
      }

      /* ── Mapa principal ── */
      #map {
        flex: 1;
        position: relative;
      }

      /* ── Panel de detalle de vehículo ── */
      #vehicle-detail {
        display: none;
        position: absolute;
        top: 16px;
        right: 16px;
        width: 260px;
        background: rgba(22, 27, 34, 0.95);
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 16px;
        z-index: 100;
      }

      #vehicle-detail.visible {
        display: block;
      }

      #detail-title {
        font-size: 16px;
        font-weight: bold;
        color: #00ff88;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
      }

      #btn-close-detail {
        background: none;
        border: none;
        color: #8b949e;
        cursor: pointer;
        font-size: 18px;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 13px;
        border-bottom: 1px solid #21262d;
      }

      .detail-label {
        color: #8b949e;
      }
      .detail-value {
        color: #ffffff;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div id="header">
      <h1>🛰️ GAGA GPS — Panel de Supervisión</h1>
      <div id="header-right">
        <span id="current-time">--:--:--</span>
        <div style="display: flex; align-items: center; gap: 6px">
          <div id="connection-dot"></div>
          <span id="connection-text">Desconectado</span>
        </div>
      </div>
    </div>

    <!-- Main -->
    <div id="main">
      <!-- Panel izquierdo -->
      <div id="left-panel">
        <!-- Métricas -->
        <div id="dashboard">
          <div class="metric-card">
            <div class="metric-label">Total</div>
            <div class="metric-value" id="metric-total">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">En línea</div>
            <div class="metric-value" id="metric-online">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Alertas</div>
            <div class="metric-value alert" id="metric-alerts">0</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Sin señal</div>
            <div class="metric-value warning" id="metric-offline">0</div>
          </div>
        </div>

        <!-- Parada preventiva -->
        <div id="stop-section">
          <button id="btn-stop" onclick="activateStop()">
            🛑 PARADA PREVENTIVA COLECTIVA
          </button>
          <button id="btn-resume" onclick="deactivateStop()">
            ✅ REANUDAR OPERACIÓN
          </button>
          <div id="stop-status">Sistema en operación normal</div>
        </div>

        <!-- Alertas activas -->
        <div id="alerts-section">
          <div id="alerts-header">Alertas recientes</div>
          <div id="alerts-list">
            <div style="color: #6e7681; font-size: 12px">
              Sin alertas activas
            </div>
          </div>
        </div>

        <!-- Lista de vehículos -->
        <div id="vehicle-list-header">Vehículos registrados</div>
        <div id="vehicle-list"></div>
      </div>

      <!-- Mapa -->
      <div id="map">
        <!-- Panel detalle vehículo -->
        <div id="vehicle-detail">
          <div id="detail-title">
            <span id="detail-name">Vehículo</span>
            <button id="btn-close-detail" onclick="closeDetail()">✕</button>
          </div>
          <div class="detail-row">
            <span class="detail-label">Estado</span>
            <span class="detail-value" id="detail-status">--</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Velocidad</span>
            <span class="detail-value" id="detail-speed">--</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Latitud</span>
            <span class="detail-value" id="detail-lat">--</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Longitud</span>
            <span class="detail-value" id="detail-lon">--</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Última actualización</span>
            <span class="detail-value" id="detail-time">--</span>
          </div>
        </div>
      </div>
    </div>

    <script>
      const BACKEND_URL =
        window.location.hostname === "localhost"
          ? "http://localhost:3001"
          : "https://app.gaga-maquinaria.com";

      // Estado
      const fleetState = {};
      const markers = {};
      const alertCount = { active: 0 };
      let selectedVehicle = null;
      let stopActive = false;

      // ── Reloj ──────────────────────────────────────────────
      setInterval(() => {
        document.getElementById("current-time").textContent =
          new Date().toLocaleTimeString("es-MX");
      }, 1000);

      // ── Mapa ───────────────────────────────────────────────
      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            osm: {
              type: "raster",
              tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
              tileSize: 256,
              attribution: "© OpenStreetMap",
            },
          },
          layers: [{ id: "osm", type: "raster", source: "osm" }],
        },
        center: [-103.7166, 19.2539],
        zoom: 16,
      });

      // ── Socket.io ──────────────────────────────────────────
      const socket = io(BACKEND_URL, {
        transports: ["websocket", "polling"],
      });

      socket.on("connect", () => {
        document.getElementById("connection-dot").classList.add("connected");
        document.getElementById("connection-text").textContent = "Conectado";
      });

      socket.on("disconnect", () => {
        document.getElementById("connection-dot").classList.remove("connected");
        document.getElementById("connection-text").textContent = "Desconectado";
      });

      // ── Geocercas — renderizadas en vivo (círculo/polígono/ruta) ──
      function circleToPolygon(lat, lon, radiusMeters, points = 32) {
        const coords = [];
        for (let i = 0; i <= points; i++) {
          const angle = (i / points) * 2 * Math.PI;
          const dLat = (radiusMeters / 111320) * Math.cos(angle);
          const dLon = (radiusMeters / (111320 * Math.cos(lat * Math.PI / 180))) * Math.sin(angle);
          coords.push([lon + dLon, lat + dLat]);
        }
        return { type: "Polygon", coordinates: [coords] };
      }

      function lineToBufferPolygon(lineGeometry, halfWidthMeters) {
        const coords = lineGeometry.coordinates;
        const left = [], right = [];
        for (let i = 0; i < coords.length; i++) {
          const [lon, lat] = coords[i];
          const prev = coords[i - 1] || coords[i];
          const next = coords[i + 1] || coords[i];
          const latRad = lat * Math.PI / 180;
          const mPerLat = 111320, mPerLon = 111320 * Math.cos(latRad);
          const dx = (next[0] - prev[0]) * mPerLon, dy = (next[1] - prev[1]) * mPerLat;
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          const perpX = -dy / len, perpY = dx / len;
          const offLon = (perpX * halfWidthMeters) / mPerLon, offLat = (perpY * halfWidthMeters) / mPerLat;
          left.push([lon + offLon, lat + offLat]);
          right.push([lon - offLon, lat - offLat]);
        }
        return { type: "Polygon", coordinates: [[...left, ...right.reverse(), left[0]]] };
      }

      function renderGeofences(geofences) {
        if (!map.isStyleLoaded()) { map.once("idle", () => renderGeofences(geofences)); return; }

        const features = [];
        (geofences || []).forEach((g) => {
          const shape = g.shapeType || "circle";
          const color = g.type === "danger" ? "#ff4444" : "#ffcc00";
          if (shape === "polygon") {
            features.push({ type: "Feature", properties: { color }, geometry: g.geometry });
          } else if (shape === "polyline") {
            const margin = g.corridorDangerMarginMeters;
            if (margin) {
              features.push({ type: "Feature", properties: { color: "#ffcc00" }, geometry: lineToBufferPolygon(g.geometry, g.corridorWidthMeters + margin) });
            }
            features.push({ type: "Feature", properties: { color: "#00ff88" }, geometry: lineToBufferPolygon(g.geometry, g.corridorWidthMeters) });
          } else {
            features.push({ type: "Feature", properties: { color }, geometry: circleToPolygon(g.center.lat, g.center.lon, g.radiusMeters) });
          }
        });

        const geojson = { type: "FeatureCollection", features };
        if (map.getSource("geofences-preview")) {
          map.getSource("geofences-preview").setData(geojson);
        } else {
          map.addSource("geofences-preview", { type: "geojson", data: geojson });
          map.addLayer({ id: "geofences-fill", type: "fill", source: "geofences-preview", paint: { "fill-color": ["get", "color"], "fill-opacity": 0.25 } });
          map.addLayer({ id: "geofences-line", type: "line", source: "geofences-preview", paint: { "line-color": ["get", "color"], "line-width": 2 } });
        }
      }

      socket.on("geofences:update", (geofences) => renderGeofences(geofences));

      // ── Posiciones de flota ────────────────────────────────
      socket.on("fleet:update", (data) => {
        data.positions.forEach((pos) => {
          updateVehicle(pos);
        });
        updateDashboard();
      });

      function updateVehicle(pos) {
        fleetState[pos.deviceId] = {
          ...pos,
          lastSeen: Date.now(),
        };

        updateVehicleMarker(pos);
        updateVehicleList();

        if (selectedVehicle === pos.deviceId) {
          showVehicleDetail(pos.deviceId);
        }
      }

      function updateVehicleMarker(pos) {
        const id = `v-${pos.deviceId}`;
        const lngLat = [pos.longitude, pos.latitude];

        if (markers[id]) {
          markers[id].setLngLat(lngLat);
        } else {
          const el = document.createElement("div");
          el.style.cssText = `
          width: 36px; height: 36px;
          border-radius: 50%;
          border: 3px solid #00ff88;
          background: #003322;
          display: flex; align-items: center; justify-content: center;
          font-size: 11px; font-weight: bold; color: #00ff88;
          cursor: pointer;
          box-shadow: 0 0 8px #00ff88;
        `;
          el.textContent = `V${pos.deviceId}`;
          el.onclick = () => showVehicleDetail(pos.deviceId);

          markers[id] = new maplibregl.Marker({ element: el })
            .setLngLat(lngLat)
            .addTo(map);
        }
      }

      // ── Lista de vehículos ─────────────────────────────────
      function updateVehicleList() {
        const list = document.getElementById("vehicle-list");
        list.innerHTML = "";

        Object.values(fleetState).forEach((v) => {
          const elapsed = Date.now() - v.lastSeen;
          const isOffline = elapsed > 45000;

          const item = document.createElement("div");
          item.className = `vehicle-item${isOffline ? " alert-active" : ""}`;
          item.onclick = () => showVehicleDetail(v.deviceId);
          item.innerHTML = `
          <div class="vehicle-header">
            <span class="vehicle-name">${v.deviceName || ('Vehículo ' + v.deviceId)}${v.deviceType ? ` <small class="vehicle-type">(${v.deviceType})</small>` : ''}</span>
            <span class="vehicle-status ${isOffline ? "offline" : ""}">
              ${isOffline ? "Sin señal" : "En línea"}
            </span>
          </div>
          <div class="vehicle-info">
            ${v.speed ? Math.round(v.speed * 3.6) : 0} km/h &nbsp;|&nbsp;
            ${v.latitude?.toFixed(5)}, ${v.longitude?.toFixed(5)}
          </div>
        `;
          list.appendChild(item);
        });
      }

      // ── Dashboard de métricas ──────────────────────────────
      function updateDashboard() {
        const total = Object.keys(fleetState).length;
        const offline = Object.values(fleetState).filter(
          (v) => Date.now() - v.lastSeen > 45000,
        ).length;
        const online = total - offline;

        document.getElementById("metric-total").textContent = total;
        document.getElementById("metric-online").textContent = online;
        document.getElementById("metric-offline").textContent = offline;
      }

      // ── Detalle de vehículo ────────────────────────────────
      function showVehicleDetail(deviceId) {
        selectedVehicle = deviceId;
        const v = fleetState[deviceId];
        if (!v) return;

        const elapsed = Date.now() - v.lastSeen;
        const isOffline = elapsed > 45000;

        document.getElementById("detail-name").textContent =
          v.deviceName ? `${v.deviceName}${v.deviceType ? ' (' + v.deviceType + ')' : ''}` : `Vehículo ${deviceId}`;
        document.getElementById("detail-status").textContent = isOffline
          ? "🔴 Sin señal"
          : "🟢 En línea";
        document.getElementById("detail-speed").textContent =
          `${Math.round((v.speed || 0) * 3.6)} km/h`;
        document.getElementById("detail-lat").textContent =
          v.latitude?.toFixed(6);
        document.getElementById("detail-lon").textContent =
          v.longitude?.toFixed(6);
        document.getElementById("detail-time").textContent = new Date(
          v.fixTime || Date.now(),
        ).toLocaleTimeString("es-MX");

        document.getElementById("vehicle-detail").classList.add("visible");

        // Centrar mapa en el vehículo
        map.flyTo({
          center: [v.longitude, v.latitude],
          zoom: 18,
          duration: 800,
        });
      }

      function closeDetail() {
        selectedVehicle = null;
        document.getElementById("vehicle-detail").classList.remove("visible");
      }

      // ── Alertas ────────────────────────────────────────────
      function addAlert(message, type = "danger") {
        const list = document.getElementById("alerts-list");
        const time = new Date().toLocaleTimeString("es-MX");

        const item = document.createElement("div");
        item.className = `alert-item ${type}`;
        item.innerHTML = `
        ${message}
        <div class="alert-time">${time}</div>
      `;

        list.insertBefore(item, list.firstChild);

        // Mantener solo las últimas 10 alertas
        while (list.children.length > 10) {
          list.removeChild(list.lastChild);
        }

        alertCount.active++;
        document.getElementById("metric-alerts").textContent =
          alertCount.active;
      }

      // Escuchar alertas del sistema
      socket.on("supervisor:alert", (data) => {
        if (data.action === "entered") {
          addAlert(
            `🚨 Vehículo ${data.deviceId} — ${data.geofenceName}`,
            "danger",
          );
        }
      });

      socket.on("supervisor:signal_lost", (data) => {
        if (data.level === 1) {
          addAlert(
            `⚠️ Vehículo ${data.deviceId} sin señal (${data.elapsedSeconds}s)`,
            "warning",
          );
        } else if (data.level === 2) {
          addAlert(
            `🚨 EMERGENCIA — Vehículo ${data.deviceId} desconectado`,
            "danger",
          );
        } else if (data.level === 0) {
          addAlert(`✅ Vehículo ${data.deviceId} reconectado`, "info");
          alertCount.active = Math.max(0, alertCount.active - 1);
          document.getElementById("metric-alerts").textContent =
            alertCount.active;
        }
      });

      socket.on("supervisor:collision", (data) => {
        const level =
          data.level === 2 ? "🚨 COLISIÓN INMINENTE" : "⚠️ Proximidad";
        addAlert(
          `${level} — V${data.deviceId1} y V${data.deviceId2} a ${data.distance}m`,
          data.level === 2 ? "danger" : "warning",
        );
      });

      socket.on("supervisor:preventive_stop", (data) => {
        if (data.active) {
          addAlert(`🛑 PARADA PREVENTIVA ACTIVADA — ${data.reason}`, "danger");
        } else {
          addAlert(`✅ Parada preventiva desactivada`, "info");
        }
      });

      // ── Parada preventiva ──────────────────────────────────
      async function activateStop() {
        if (
          !confirm(
            "¿Confirma la activación de la PARADA PREVENTIVA COLECTIVA?\nTodos los vehículos recibirán la orden de detenerse.",
          )
        )
          return;

        const res = await fetch(`${BACKEND_URL}/api/fleet/stop`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            reason: "Activado manualmente por supervisor",
          }),
        });

        if (res.ok) {
          stopActive = true;
          document.getElementById("btn-stop").style.display = "none";
          document.getElementById("btn-resume").classList.add("visible");
          document.getElementById("stop-status").textContent =
            "🛑 PARADA PREVENTIVA ACTIVA";
          document.getElementById("stop-status").classList.add("active");
        }
      }

      async function deactivateStop() {
        if (
          !confirm(
            "¿Confirma la reanudación de operaciones?\nAsegúrese de que la situación de emergencia ha sido resuelta.",
          )
        )
          return;

        const res = await fetch(`${BACKEND_URL}/api/fleet/resume`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
        });

        if (res.ok) {
          stopActive = false;
          document.getElementById("btn-stop").style.display = "block";
          document.getElementById("btn-resume").classList.remove("visible");
          document.getElementById("stop-status").textContent =
            "Sistema en operación normal";
          document.getElementById("stop-status").classList.remove("active");
        }
      }

      // Escuchar parada preventiva activada remotamente
      socket.on("fleet:preventive_stop", (data) => {
        stopActive = true;
        document.getElementById("btn-stop").style.display = "none";
        document.getElementById("btn-resume").classList.add("visible");
        document.getElementById("stop-status").textContent =
          `🛑 ACTIVA — ${data.reason}`;
        document.getElementById("stop-status").classList.add("active");
      });

      socket.on("fleet:preventive_stop_clear", () => {
        stopActive = false;
        document.getElementById("btn-stop").style.display = "block";
        document.getElementById("btn-resume").classList.remove("visible");
        document.getElementById("stop-status").textContent =
          "Sistema en operación normal";
        document.getElementById("stop-status").classList.remove("active");
      });

      // Actualizar dashboard cada 5 segundos
      setInterval(updateDashboard, 5000);
      setInterval(updateVehicleList, 5000);
    </script>
  </body>
</html>
