networks:
  gaga-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:

  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: gaga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gaga_gps
      POSTGRES_USER: gaga_app
      POSTGRES_PASSWORD: gaga_dev_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - gaga-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaga_app -d gaga_gps"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: gaga-redis
    restart: unless-stopped
    command: redis-server --requirepass gaga_redis_pass
    volumes:
      - redis_data:/data
    networks:
      - gaga-net
    ports:
      - "6379:6379"